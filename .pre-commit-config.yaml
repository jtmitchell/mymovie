# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_stages: [pre-commit]
default_language_version:
  python: python3.12
exclude: "[a-zA-Z]*/(migrations)/(.)*"
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: "v5.0.0"
  hooks:
  - id: trailing-whitespace
    exclude: "(.bumpversion.cfg)"
  - id: end-of-file-fixer
  - id: requirements-txt-fixer
  - id: mixed-line-ending
  - id: check-ast
  - id: check-yaml
    args: ["--unsafe"]
  - id: check-added-large-files
- repo: https://github.com/abravalheri/validate-pyproject
  rev: "v0.24.1"
  hooks:
      - id: validate-pyproject
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version. Keep this in sync with the venv installed version
  rev: v0.12.7
  hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/PyCQA/bandit
  rev: "1.8.6"
  hooks:
  - id: bandit
    args:
      - "--quiet"
      - "--configfile=pyproject.toml"
    additional_dependencies: [ "bandit[toml]" ]

- repo: https://github.com/asottile/pyupgrade
  rev: v3.20.0
  hooks:
  - id: pyupgrade
- repo: https://github.com/adamchainz/django-upgrade
  rev: 1.25.0
  hooks:
  - id: django-upgrade
    args: [--target-version, "5.2"]

## These checks for migrations require the database to be available
- repo: https://github.com/ecugol/pre-commit-hooks-django
  rev: "v0.4.0"
  hooks:
  - id: check-untracked-migrations
- repo: local
  hooks:
  - id: pre-commit-django-migrations
    name: Check django migrations
    ## Do a manual check. The pre-commit-hooks-django one started erroring on me.
    entry: src/manage.py makemigrations --check --dry-run
    language: system
    types: [python]
    pass_filenames: false
