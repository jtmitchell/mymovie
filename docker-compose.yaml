version: "3"
services:
  postgres:
    image: docker.io/postgres:18
    environment:
      - ALLOW_EMPTY_PASSWORD="no"
      - POSTGRES_DB=webapp
      - POSTGRES_USER=webapp
      - POSTGRES_PASSWORD=webapp1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webapp -d webapp"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        aliases:
          - postgres.localhost

  redis:
    image: docker.io/redis:7.2
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      default:
        aliases:
          - redis.localhost

  # SMTP server to capture outgoing emails
  mailhog:
    image: docker.io/mailhog/mailhog
    logging:
      driver: "none" # disable to verbose logs
    entrypoint: ["/bin/sh", "-c", "MailHog &>/dev/null"]
    networks:
      default:
        aliases:
          - mailhog.localhost

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/var/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://webapp:webapp1234@postgres.localhost:5432/webapp
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-secret_key}
    networks:
      default:
    restart: "no"

  webapp:
    # Override the wsgi entrypoint. Run the development server listening on all interfaces
    # debugpy docs https://github.com/microsoft/debugpy
    entrypoint:
      [
        "sh",
        "-c",
        "python -m debugpy --listen 0.0.0.0:5678 /var/app/manage.py runserver 0.0.0.0:8000",
      ]
    ports:
      - "5678:5678" # debug port
    image: mymovie
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    # volumes:
    #   - .:/var/app
    read_only: true
    tmpfs:
      - /var/tmp:mode=770,uid=1000,gid=1000
    depends_on:
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      postgres:
        condition: service_started
      mailhog:
        condition: service_started
    environment:
      - SERVER_PORT=8000
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-'dev-key'}
      - GOOGLE_PLUS_KEY=${GOOGLE_PLUS_KEY:-''}
      - GOOGLE_PLUS_SECRET=${GOOGLE_PLUS_SECRET:-''}
      - DATABASE_URL=postgres://webapp:webapp1234@postgres.localhost:5432/webapp
    networks:
      default:
        aliases:
          - movies.localhost
