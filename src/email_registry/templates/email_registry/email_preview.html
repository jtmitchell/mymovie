{% extends "admin/base_site.html" %}

{% block breadcrumbs %}
<div class="breadcrumbs">
  <a href="{% url 'admin:index' %}">Home</a>
  &rsaquo; <a href="{% url 'admin:app_list' app_label='email_registry' %}">Email Registry</a>
  &rsaquo; <a href="{% url 'admin:email_registry_emailregistrymodel_changelist' %}">Emails</a>
  &rsaquo; {{ identifier }}
</div>
{% endblock %}

{% block content %}
<h1>Subject: {{ email_subject }}</h1>
<iframe
  srcdoc="{{ rendered_email|force_escape }}"
  style="width: 100%; height: 600px; border: 1px solid var(--border-color); display: block;"
  onload="this.style.height = this.contentDocument.documentElement.scrollHeight + 'px';"
  scrolling="no"
></iframe>
{% endblock %}
