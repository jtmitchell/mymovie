[project]
name = "mymovie-server"
version = "0.1.0"
description = "Default template for PDM package"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "dj-database-url",
    "django",
    "django-allauth[mfa]",
    "django-filter",
    "django-htmx",
    "django-ninja",
    "granian",
    "markdown",
    "psycopg2-binary",
    "python-dotenv",
    "whitenoise",
]
authors = [
    {name = "James Mitchell", email = "say.wibble@gmail.com"},
]
license = {text = "MIT"}

[dependency-groups]
dev = [
    "bandit",
    "coverage",
    "debugpy",
    "django-debug-toolbar",
    "django-stubs",
    "django-types",
    "django-upgrade",
    "factory-boy",
    "fake-factory",
    "mock",
    "pre-commit",
    "pytest",
    "pytest-django",
    "pyupgrade",
    "ruff",
    "ruff-lsp",
    "types-dj-database-url",
]
[tool.pytest.ini_options]
addopts = "--ignore=templates/"

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.bandit]
# Configuration for bandit security checking tool
exclude_dirs = [
    "templates/",
    "**/test*.py"
]
[tool.pdm]
distribution = false
plugins = [
    "pdm-bump",
    "pdm-version",
    "pdm-django",
    "pdm-dotenv",
    "pdm-shear"
]
