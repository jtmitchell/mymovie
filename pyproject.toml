[project]
name = "mymovie-server"
version = "0.1.0"
description = "Default template for PDM package"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "dj-database-url",
    "django",
    "django-allauth[mfa]",
    "django-filter",
    "django-htmx",
    "django-ninja>=1.6.2",
    "granian",
    "markdown",
    "psycopg2-binary",
    "python-dotenv",
    "whitenoise",
    "django-appconf>=1.2.0",
    "regex>=2026.2.28",
    "requests>=2.33.0",
]
authors = [
    {name = "James Mitchell", email = "say.wibble@gmail.com"},
]
license = {text = "MIT"}

[dependency-groups]
dev = [
    "bandit",
    "coverage",
    "debugpy",
    "django-debug-toolbar",
    "django-stubs",
    "django-types",
    "django-upgrade",
    "factory-boy",
    "fake-factory",
    "mock",
    "pre-commit",
    "pre-commit-uv",
    "pytest",
    "pytest-django",
    "pyupgrade",
    "ruff",
    "ruff-lsp",
    "types-dj-database-url",
    "djlint",
]

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = ["--ignore=templates/"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
markers = []


[tool.basedpyright]
typeCheckingMode = "standard"

[tool.bandit]
# Configuration for bandit security checking tool
exclude_dirs = [
    "templates/",
    "**/test*.py",
    "**/tests/",
    "**/factories.py",
    "conftest.py",
]


[tool.djlint]
profile = "django"
indent = 4
max_line_length = 120        # matches ruff
max_attribute_length = 80
preserve_blank_lines = true
use_gitignore = true
ignore = "H006,H021,H023,H030,H031,T003"              # meta keywords - not relevant for app templates

[tool.djlint.per-file-ignores]
"templates/components/*.html" = "H006"  # img width/height - cotton components often omit these
