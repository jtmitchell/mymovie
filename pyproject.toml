[project]
name = "mymovie"
version = "0.1.0"
description = "Webapp to track movie releases from a wishlist, so you don't have to"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "dj-database-url>=3.0.1",
    "django>=5.2.7",
    "django-allauth[mfa]>=65.12.1",
    "django-filter>=25.2",
    "django-htmx>=1.26.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt[crypto]>=5.5.1",
    "drf-nested-routers>=0.95.0",
    "jsonfield>=3.2.0",
    "kubernetes-wsgi>=1.2",
    "markdown>=3.9",
    "psycopg2>=2.9.11",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.1.1",
    "whitenoise>=6.11.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "coverage>=7.11.0",
    "debugpy>=1.8.17",
    "django-debug-toolbar>=6.0.0",
    "django-stubs>=5.2.7",
    "django-types>=0.22.0",
    "django-upgrade>=1.29.0",
    "djangorestframework-stubs>=3.16.4",
    "factory-boy>=3.3.3",
    "fake-factory>=9999.9.9",
    "mock>=5.2.0",
    "pre-commit>=4.3.0",
    "pre-commit-uv>=4.2.0",
    "pytest>=8.4.2",
    "pytest-django>=4.11.1",
    "pyupgrade>=3.21.0",
    "ruff>=0.14.1",
    "ruff-lsp>=0.0.62",
    "types-dj-database-url>=1.3.0.4",
]
[tool.pytest.ini_options]
addopts = "--ignore=templates/"

[tool.bandit]
# Configuration for bandit security checking tool
exclude_dirs = [
    "templates/",
    "**/test*.py"
]
