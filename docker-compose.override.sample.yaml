configs:
  traefik_static:
    content: |
      api:
        insecure: true

      providers:
        docker:
          exposedByDefault: false
        file:
          filename: /etc/traefik/tls.yml

      entryPoints:
        web:
          address: ":80"
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https
        websecure:
          address: ":443"
  traefik_tls:
    content: |
      tls:
        certificates:
          - certFile: /certs/local-cert.pem
            keyFile: /certs/local-key.pem
        stores:
          default:
            defaultCertificate:
              certFile: /certs/local-cert.pem
              keyFile: /certs/local-key.pem

services:
  traefik:
    image: traefik:v3.6
    command:
      - --configfile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik dashboard
    configs:
      - source: traefik_static
        target: /etc/traefik/traefik.yml
      - source: traefik_tls
        target: /etc/traefik/tls.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../localhost-certs/local-cert.pem:/certs/local-cert.pem:ro
      - ../localhost-certs/local-key.pem:/certs/local-key.pem:ro

  mailhog:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mailhog.localhost`)"
      - "traefik.http.routers.mailhog.entrypoints=websecure"
      - "traefik.http.routers.mailhog.tls=true"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"

  webapp:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`webapp.localhost`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.services.app.loadbalancer.server.port=8000"

  postgres:
    ports:
      - "5432:5432"
