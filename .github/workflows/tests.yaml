# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Run tests

on:
  pull_request:
  workflow_dispatch: # Allows to trigger the workflow manually in GitHub UI

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      DJANGO_SETTINGS_MODULE: config.settings.pipeline_actions
      DB_NAME: webapp
      DB_USER: webapp
      DB_PASSWORD: webapp1234
      DATABASE_URL: postgres://${{ env.DB_USER }}:${{ env.DB_PASSWORD }}@localhost:5432/${{ env.DB_NAME }}

    services:
      postgres:
        image: docker.io/postgres:18
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres -h 127.0.0.1 -p 5432" --health-interval=10s --health-timeout=5s --health-retries=3
        env:
          ALLOW_EMPTY_PASSWORD: no
          POSTGRES_DB: ${{ env.DB_NAME }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
      redis:
        image: docker.io/redis:7.2
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pdm
        uses: pdm-project/setup-pdm@v4

      - name: Install dependencies
        run: pdm install --dev --frozen-lockfile --plugins

      - name: Code checks
        run: |
          pdm run ruff check .
          pdm run pre-commit run bandit --all-files

      - name: Tests
        run: pdm run pytest
