services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    depends_on:
      postgres:
        condition: service_healthy # waits for pg_isready to pass
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    expose:
      - 8000
    ports:
      - "5678:5678" # debug port
    command: sleep infinity
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.development}
      - DATABASE_URL=postgres://webapp:webapp1234@postgres.localhost:5432/webapp
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-secret_key}
    env_file:
      - "../.env"
      - "./devcontainer.env"
    networks:
      default:
        aliases:
          - devcontainer.localhost

    # SMTP server to capture outgoing emails
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    environment:
      - TZ=Pacific/Auckland
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    networks:
      default:
        aliases:
          - mailpit.localhost

  redis:
    image: docker.io/redis:7.2
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      default:
        aliases:
          - redis.localhost

  postgres:
    image: docker.io/postgres:18
    environment:
      - ALLOW_EMPTY_PASSWORD="no"
      - POSTGRES_DB=webapp
      - POSTGRES_USER=webapp
      - POSTGRES_PASSWORD=webapp1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webapp -d webapp"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        aliases:
          - postgres.localhost
