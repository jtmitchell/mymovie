services:
  # SMTP server to capture outgoing emails
  mailhog:
    image: docker.io/mailhog/mailhog
    logging:
      driver: "none" # disable to verbose logs
    entrypoint: ["/bin/sh", "-c", "MailHog &>/dev/null"]
    networks:
      default:
        aliases:
          - mailhog.localhost

  redis:
    image: docker.io/redis:7.2
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      default:
        aliases:
          - redis.localhost

  postgres:
    image: docker.io/postgres:18
    environment:
      - ALLOW_EMPTY_PASSWORD="no"
      - POSTGRES_DB=webapp
      - POSTGRES_USER=webapp
      - POSTGRES_PASSWORD=webapp1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webapp -d webapp"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        aliases:
          - postgres.localhost

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE=ubuntu
    volumes:
      - ..:/workspace:cached
    depends_on:
      postgres:
        condition: service_healthy # waits for pg_isready to pass
      redis:
        condition: service_started
      mailhog:
        condition: service_started
    expose:
      - 8000
    ports:
      - "5678:5678" # debug port
    command: sleep infinity
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.development}
      - DATABASE_URL=postgres://webapp:webapp1234@postgres.localhost:5432/webapp
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-secret_key}
    networks:
      default:
        aliases:
          - webapp.localhost
